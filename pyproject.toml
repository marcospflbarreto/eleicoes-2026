[project]
name = "eleicoes-2026"
version = "0.1.0"
description = "Download e análise forense dos Boletins de Urna da eleição presidencial de 2026"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
baixar = "eleicoes_2026.download:main"
processar = "eleicoes_2026.process:main"
perfil = "eleicoes_2026.perfil:main"
coletar-legislativo = "eleicoes_2026.legislativo:main"
